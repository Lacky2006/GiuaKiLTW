<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàng Vĩnh Phúc | Portfolio</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }

    
        h1 {
            margin: 5px 0;
            color: #007bff;
            font-size: 24px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 20px;
        }

    
        .section {
            text-align: left;
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #007bff;
        }

        .section h2 {
            font-size: 18px;
            margin-top: 0;
            color: #333;
        }

    
        ul {
            margin: 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        /* Liên hệ */
        .contact-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .contact-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="HoangVinhPhuc/VinhPhuc.png" alt="Hoàng Vĩnh Phúc" class="avatar">
        
        <h1>Hoàng Vĩnh Phúc</h1>
        <p class="subtitle">Sinh viên CNTT / Lập trình viên Web</p>

        <div class="section">
            <h2>Giới thiệu</h2>
            <p>Xin chào! Mình là Phúc, có đam mê lập trình web và học hỏi các công nghệ mới.</p>
        </div>

        <div class="section">
            <h2>Kỹ năng</h2>
            <ul>
                <li>HTML5 / CSS3 / JavaScript</li>
                <li>Lập trình Web responsive</li>
                <li>Sử dụng Git & GitHub</li>
            </ul>
        </div>

        <a href="phuc062006@gmail.com" class="contact-link">Liên hệ với tôi</a>
    </div>

</body>
</html>
