name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            DothienLoc/normal-portfolio/package-lock.json
            DothienLoc/unique-portfolio/package-lock.json

      - name: Build basic portfolio
        working-directory: DothienLoc/normal-portfolio
        run: |
          npm ci
          npm run build

      - name: Build unique portfolio
        working-directory: DothienLoc/unique-portfolio
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site
        run: |
          mkdir _site
          touch _site/.nojekyll
          git archive HEAD | tar -x -C _site
          mkdir -p _site/DothienLoc/normal-portfolio/dist
          mkdir -p _site/DothienLoc/unique-portfolio/dist
          cp -a DothienLoc/normal-portfolio/dist/. _site/DothienLoc/normal-portfolio/dist/
          cp -a DothienLoc/unique-portfolio/dist/. _site/DothienLoc/unique-portfolio/dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
